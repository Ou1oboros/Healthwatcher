server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the api Service (same name in docker-compose and in the
    # cluster), so the browser only ever talks to this origin - no CORS, no
    # hardcoded backend host.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
