# Scales horizontally: every replica serves the API, but only the one holding the monitor
# lease runs the check timer, so a target is probed once per interval however many pods
# there are. They share the SQLite file on the PVC - see api-pvc.yaml and the README.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: healthwatcher
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # The image runs as non-root (UID 1654) but a fresh volume arrives owned by root, and
      # the app then cannot create the database file. fsGroup is ignored by minikube's
      # hostPath-backed PV, so chown it here instead. Same image, run as root.
      initContainers:
        - name: chown-data
          image: healthwatcherapi:local
          imagePullPolicy: IfNotPresent
          command: ["chown", "-R", "1654:1654", "/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: api
          image: healthwatcherapi:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          volumeMounts:
            # The database file, so history survives a restart and every replica shares it.
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-data
        - name: config
          configMap:
            name: api-config
