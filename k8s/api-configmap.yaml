# Mounted as appsettings.Production.json, layered over the baked-in appsettings.json, so
# the monitored URLs change with a re-apply and restart rather than a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: healthwatcher
data:
  appsettings.Production.json: |
    {
      "ConnectionStrings": {
        "DefaultConnection": "Data Source=/data/healthwatcher.db"
      },
      "Monitoring": {
        "IntervalSeconds": 30,
        "TimeoutSeconds": 10,
        "MaxConcurrentChecks": 10,
        "LeaseTtlSeconds": 90,
        "Targets": [
          "https://www.google.com",
          "https://github.com",
          "https://www.nic.gov.sa",
          "https://httpstat.us/503"
        ]
      }
    }
