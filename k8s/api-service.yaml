# ClusterIP only: nothing outside the cluster needs to reach the API directly. The
# browser talks to it through nginx's /api/ reverse proxy inside the ui pod (see
# HealthwatcherUi/nginx.conf), the same way it does with docker-compose.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: healthwatcher
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
